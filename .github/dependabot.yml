# Dependency updates with a cooldown, so a freshly published version is never pulled
# in the window when a compromised release is most likely to still be up.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    # `github/codeql-action/init` and `github/codeql-action/analyze` are two entries in
    # Dependabot's index and one program on the runner: `analyze` reads the configuration
    # `init` wrote and refuses a version it did not write. Ungrouped, the weekly bump
    # arrives as two PRs, each of which is a skew on its own branch and would be a skew on
    # `main` for as long as the second one took to merge. Grouped, both `uses:` lines move
    # in one commit or neither does.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # The page-check toolchain: html-validate, axe-core and jsdom. Development only.
  # Nothing from npm ships in the site; the pages carry no script at all.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
