[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The distribution name on PyPI, not the import name and not the module you run:
# `perimeter` is taken there by YunoJuno's Django middleware ("Site-wide perimeter
# access control for Django projects", 0.14), so this project could never have been
# released under it. `perimeter-wildfire` is free as of this decision (checked
# against pypi.org on 2026-09-07, HTTP 404) and is a placeholder pending
# confirmation, not a claim already made — nothing has been uploaded under either
# name, and this repository has no publish workflow. The package directory stays
# `src/perimeter/`, so `import perimeter` and `python -m perimeter.acquire` are
# unaffected. The only other place carrying this string is the `[[package]]` entry
# in `uv.lock` (regenerate with `uv lock`).
name = "perimeter-wildfire"
version = "0.1.0"
description = "Coverage and completeness measures over California's public wildfire datasets"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
  { name = "Chelsea Kelly-Reif" },
]
readme = "README.md"
dependencies = []

[dependency-groups]
dev = [
  "ruff>=0.16.5",
  "mypy>=2.3.1",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-xdist>=3.6",
  "pip-audit>=2.7",
  "jsonschema>=4.23",
]

[tool.hatch.build.targets.wheel]
# `py.typed` (PEP 561) rides along with the package directory. Without it a consumer
# running `mypy --strict` skips this module and carries an override for it, which is what
# the audit in the consuming project's docs/UPSTREAM.md recorded on 2026-09-05.
packages = ["src/perimeter"]
artifacts = ["src/perimeter/py.typed"]

# --- CODE-QUALITY-STANDARD §2 single-source ruff/mypy/pytest config ---
# Portfolio default: repos change values, not keys. Do not fork this block;
# edit STANDARDS/CODE-QUALITY-STANDARD.md upstream if the floor itself moves.

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "S", "C90", "RUF"]
ignore = ["E501"]            # line length owned by the formatter
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]        # assert is expected in tests
[tool.ruff.lint.mccabe]
max-complexity = 10
[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
warn_return_any = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["src"]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
  "slow: > 2s",
  "integration: requires an external service",
  "smoke: critical path",
]

[tool.coverage.run]
branch = true
source = ["src"]
# No omit list. acquire.py was excluded here until 2026-08-15, on the reasoning that it
# is run by hand and never in CI. That is true of the *network call* and false of the
# module: every refusal it makes (HTTPS only, stop on 401/403/429, refuse a non-JSON
# challenge page, pause between pages) is testable with the socket substituted, and
# tests/test_acquire.py now does exactly that. Omitting it moved the reported figure from
# 88% to 100% and let the 90% floor pass over the one module carrying this project's
# stated promises about somebody else's server.
[tool.coverage.report]
fail_under = 90   # CODE-QUALITY-STANDARD §2 floor for a measurement library
show_missing = true
